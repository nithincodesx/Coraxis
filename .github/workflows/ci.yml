name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never talks to a real provider. Tests use fakes.
  CORAXIS_ENV: development
  CORAXIS_SECRET_KEY: ci-only-secret-key-not-used-in-production-0000000000
  CORAXIS_LOG_LEVEL: WARNING

jobs:
  quality:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy
        run: mypy src

      - name: Production config smoke test
        run: |
          python - <<'EOF'
          import os
          from coraxis.core.config import get_settings, reset_settings_cache

          # 1. Valid production config must boot.
          os.environ["CORAXIS_ENV"] = "production"
          os.environ["CORAXIS_SECRET_KEY"] = "prod-secret-key-at-least-32-chars-long"
          os.environ["CORAXIS_CORS_ORIGINS"] = "https://example.com"
          os.environ["CORAXIS_ALLOW_REGISTRATION"] = "false"
          os.environ["CORAXIS_DEBUG"] = "false"
          reset_settings_cache()
          settings = get_settings()
          assert settings.is_production
          assert settings.secret_key.get_secret_value() == "prod-secret-key-at-least-32-chars-long"

          # 2. Weak secret must be rejected in production.
          reset_settings_cache()
          os.environ["CORAXIS_SECRET_KEY"] = "weak"
          try:
              get_settings()
          except ValueError as exc:
              assert "CORAXIS_SECRET_KEY" in str(exc)
          else:
              raise AssertionError("weak secret was accepted in production")

          # 3. Wildcard CORS must be rejected in production.
          reset_settings_cache()
          os.environ["CORAXIS_SECRET_KEY"] = "prod-secret-key-at-least-32-chars-long"
          os.environ["CORAXIS_CORS_ORIGINS"] = "*"
          try:
              get_settings()
          except ValueError as exc:
              assert "CORS_ORIGINS" in str(exc)
          else:
              raise AssertionError("wildcard CORS was accepted in production")

          # 4. Open registration must be rejected in production.
          reset_settings_cache()
          os.environ["CORAXIS_CORS_ORIGINS"] = "https://example.com"
          os.environ["CORAXIS_ALLOW_REGISTRATION"] = "true"
          try:
              get_settings()
          except ValueError as exc:
              assert "ALLOW_REGISTRATION" in str(exc)
          else:
              raise AssertionError("open registration was accepted in production")

          # 5. Debug must be rejected in production.
          reset_settings_cache()
          os.environ["CORAXIS_ALLOW_REGISTRATION"] = "false"
          os.environ["CORAXIS_DEBUG"] = "true"
          try:
              get_settings()
          except ValueError as exc:
              assert "DEBUG" in str(exc)
          else:
              raise AssertionError("debug mode was accepted in production")

          print("Production config smoke test passed.")
          EOF

  test:
    name: Tests (SQLite, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=coraxis --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  test-postgres:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coraxis
          POSTGRES_PASSWORD: coraxis
          POSTGRES_DB: coraxis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coraxis -d coraxis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CORAXIS_DATABASE_URL: postgresql+asyncpg://coraxis:coraxis@localhost:5432/coraxis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -m "not slow"

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Production build
        run: npm run build
        working-directory: frontend
