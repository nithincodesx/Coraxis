# ─────────────────────────────────────────────────────────────────────
#  Alembic configuration.
#
#  The database URL is NOT read from this file — `src/coraxis/db/migrations/env.py`
#  pulls it from Coraxis settings so there is exactly one source of truth
#  (the CORAXIS_DATABASE_URL environment variable).
# ─────────────────────────────────────────────────────────────────────

[alembic]
script_location = src/coraxis/db/migrations
prepend_sys_path = src
version_path_separator = os
# Timestamp-prefixed revision files sort chronologically in the directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Intentionally empty. A `ruff format` post-write hook looks tidy but depends on
# an entrypoint that is not resolvable in every install layout, which turns a
# successful migration generation into a reported failure. Run `make format`
# instead — CI enforces formatting either way.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
