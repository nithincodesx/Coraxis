# ─────────────────────────────────────────────────────────────────────
#  Coraxis — optional local infrastructure
#
#  SQLite is the default and needs none of this. Bring Postgres up only
#  if you want to develop against the production database engine:
#
#      docker compose up -d postgres
#      export CORAXIS_DATABASE_URL=postgresql+asyncpg://coraxis:coraxis@localhost:5432/coraxis
#      make migrate
# ─────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: coraxis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coraxis
      POSTGRES_PASSWORD: coraxis
      POSTGRES_DB: coraxis
      # Deterministic collation keeps index ordering identical across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - coraxis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coraxis -d coraxis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coraxis-pgdata:
